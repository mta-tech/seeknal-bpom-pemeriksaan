name: TC_PMR_RANK_GRADE_01
scenario_id: TC-PMR-RANK-GRADE-01
verification_date: '2026-08-14'
description: 'Peringkat nilai `grade`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'grade apa yang paling banyak pada pemeriksaan?'
  assert_contains:
  - 'A'
  assert_any_of:
  -
    - '24.631'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT grade, COUNT(*) AS jumlah FROM mv_pemeriksaan WHERE grade IS NOT NULL AND btrim(grade) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''A'' dengan 24.631. KOLOM: `grade` di `mv_pemeriksaan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(grade) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
