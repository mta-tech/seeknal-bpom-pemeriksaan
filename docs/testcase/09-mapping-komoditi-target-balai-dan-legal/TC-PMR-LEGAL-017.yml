name: TC_PMR_LEGAL_017
scenario_id: TC-PMR-LEGAL-017
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `legal`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan legal KIOS / WARUNG?'
  assert_contains:
  - 'KIOS / WARUNG'
  assert_any_of:
  -
    - '10.543'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE legal = ''KIOS / WARUNG'';
    
    HASIL DB 14Agu2026 = 10.543. KOLOM: `legal` di `mv_pemeriksaan`. NILAI FILTER: ''KIOS / WARUNG'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
