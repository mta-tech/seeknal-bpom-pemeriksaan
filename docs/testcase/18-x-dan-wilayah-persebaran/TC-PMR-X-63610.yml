description: 'Silang dua kolom berkode; menguji resolusi dua konsep sekaligus.'
turns:
- prompt: 'berapa pemeriksaan OBAT dengan kesimpulan NULL?'
  assert_contains:
  - 'OBAT'
  - 'NULL'
  assert_any_of:
  -
    - '1.308'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''OBAT'' AND kesimpulan = ''NULL'';
    
    HASIL DB 14Agu2026 = 1.308. DUA KOLOM BERKODE: `komoditi` = ''OBAT'' dan `kesimpulan` = ''NULL''. Keduanya nilai persis dari data. Bila kolom vonis termasuk di sini, ingat bahwa gradasi dicocokkan dengan pola awalan bila pertanyaannya menyebut keluarga, bukan satu tingkat tertentu.'
