name: TC_PMR_KOSONG_KLASIFIKASI_DISTRIBUSI
scenario_id: TC-PMR-KOSONG-KLASIFIKASI-DISTRIBUSI
verification_date: '2026-08-14'
description: 'Keterisian `klasifikasi_distribusi`; menguji penanganan penanda kosong yang lebih dari satu bentuk.'
turns:
- prompt: 'berapa pemeriksaan yang belum punya klasifikasi distribusi?'
  assert_contains: []
  assert_any_of:
  -
    - '197.599'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE klasifikasi_distribusi IS NULL OR btrim(klasifikasi_distribusi) = '''';
    
    HASIL DB 14Agu2026 = 197.599 kosong, 59.923 terisi. PENANDA KOSONG: kolom ini memakai lebih dari satu bentuk kosong, sehingga `IS NULL` saja TIDAK cukup — string kosong juga harus dihitung. Itulah sebabnya SQL di atas memakai `IS NULL OR btrim(...) = ''''`. MAKNA KOSONG: periksa apakah kosongnya acak atau menandai sebuah kelompok; bila deterministik, menyaring ''yang terisi'' diam-diam membuang kelompok itu.'
