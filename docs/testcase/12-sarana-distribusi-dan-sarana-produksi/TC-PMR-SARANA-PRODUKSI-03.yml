name: TC_PMR_SARANA_PRODUKSI_03
scenario_id: TC-PMR-SARANA-PRODUKSI-03
verification_date: '2026-08-14'
description: 'TC-PMR-SARANA-PRODUKSI-03 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'analisis jumlah seluruh sarana produksi dan distribusi (tanpa pengulangan nama yang sama) per komoditi produk (obat/oba/sk/kos/po) yang telah diperiksa bpom dalam periode 2025'
  assert_contains:
  - 'DISTRIBUSI'
  assert_any_of:
  -
    - '2'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT sarana, komoditi, kesimpulan, count(DISTINCT nama_sarana) FROM public.mv_pemeriksaan mp WHERE (lower(sarana) LIKE ''%produksi%'' OR lower(sarana) LIKE ''%distribusi%'') AND mp.status IN (''VERIFY4'', ''VERIFY5'',''VERIFY6'',''VERIFY7'',''FINISHED'') AND EXTRACT(YEAR FROM mp.tanggal_mulai) = 2025 GROUP BY 1, 2, 3;
    
    DATA YANG DITANYA: mv_pemeriksaan + mp. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 46 baris; baris teratas ''DISTRIBUSI'' dengan nilai 2.'
