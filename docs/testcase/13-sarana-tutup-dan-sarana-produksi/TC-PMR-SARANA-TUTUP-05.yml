verification_date: '2026-08-14'
description: 'TC-PMR-SARANA-TUTUP-05 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'sebutkan sarana distribusi yang tutup tahun 2025?'
  assert_contains:
  - 'ANDIKA KARYA SEJAHTERA'
  assert_any_of:
  -
    - 'ANDIKA KARYA SEJAHTERA'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_sarana FROM mv_pemeriksaan WHERE lower(sarana) LIKE ''distribusi'' AND EXTRACT(YEAR FROM tanggal_selesai) = 2025 AND kesimpulan LIKE ''TTP'' GROUP BY nama_sarana;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: daftar rinci, bukan satu angka; sajikan sebagai tabel. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 79 baris; baris teratas ''ANDIKA KARYA SEJAHTERA''.'
