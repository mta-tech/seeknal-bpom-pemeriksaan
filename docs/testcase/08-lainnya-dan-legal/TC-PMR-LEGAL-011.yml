name: TC_PMR_LEGAL_011
scenario_id: TC-PMR-LEGAL-011
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `legal`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan legal TOKO?'
  assert_contains:
  - 'TOKO'
  assert_any_of:
  -
    - '48.275'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE legal = ''TOKO'';
    
    HASIL DB 14Agu2026 = 48.275. KOLOM: `legal` di `mv_pemeriksaan`. NILAI FILTER: ''TOKO'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
