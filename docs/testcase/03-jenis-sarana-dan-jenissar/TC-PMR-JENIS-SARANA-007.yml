name: TC_PMR_JENIS_SARANA_007
scenario_id: TC-PMR-JENIS-SARANA-007
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana BALAI PENGOBATAN / KLINIK?'
  assert_contains:
  - 'BALAI PENGOBATAN / KLINIK'
  assert_any_of:
  -
    - '10.172'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''BALAI PENGOBATAN / KLINIK'';
    
    HASIL DB 14Agu2026 = 10.172. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''BALAI PENGOBATAN / KLINIK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
