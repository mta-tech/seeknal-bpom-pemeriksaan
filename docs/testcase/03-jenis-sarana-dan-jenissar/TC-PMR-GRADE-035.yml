name: TC_PMR_GRADE_035
scenario_id: TC-PMR-GRADE-035
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `grade`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan grade N/A?'
  assert_contains:
  - 'N/A'
  assert_any_of:
  -
    - '65'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE grade = ''N/A'';
    
    HASIL DB 14Agu2026 = 65.
    
    KOLOM: `grade` di `mv_pemeriksaan`. NILAI FILTER: ''N/A'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
