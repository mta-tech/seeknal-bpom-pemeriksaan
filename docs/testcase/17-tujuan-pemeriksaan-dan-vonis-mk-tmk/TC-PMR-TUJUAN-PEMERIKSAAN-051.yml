name: TC_PMR_TUJUAN_PEMERIKSAAN_051
scenario_id: TC-PMR-TUJUAN-PEMERIKSAAN-051
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `tujuan_pemeriksaan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan tujuan pemeriksaan RENCANA AKSI / INTENSIFIKASI PENGAWASAN?'
  assert_contains:
  - 'RENCANA AKSI / INTENSIFIKASI PENGAWASAN'
  assert_any_of:
  -
    - '7.005'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tujuan_pemeriksaan = ''RENCANA AKSI / INTENSIFIKASI PENGAWASAN'';
    
    HASIL DB 14Agu2026 = 7.005. KOLOM: `tujuan_pemeriksaan` di `mv_pemeriksaan`. NILAI FILTER: ''RENCANA AKSI / INTENSIFIKASI PENGAWASAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
