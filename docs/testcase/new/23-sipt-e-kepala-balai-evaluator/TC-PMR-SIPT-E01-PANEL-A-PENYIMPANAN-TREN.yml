  note: 'SQL: SELECT EXTRACT(YEAR FROM f.tgl_start) thn, count(DISTINCT b.pemeriksaan_id) FROM bridge_pemeriksaan_skor_operasional b JOIN fact_pemeriksaan f ON f.id=b.pemeriksaan_id WHERE b.area_key LIKE
    ''tx_penyimpanan%'' AND EXTRACT(YEAR FROM f.tgl_start) IN (2024,2025) GROUP BY 1; DB staging 25 Sep 2026: kasus yang menilai penyimpanan pelayanan 2024=12.111, 2025=8.344. Skor item sumber kepatuhan
    (opsi kosong). PANEL A pelayanan - jangan digabung dengan panel produksi. Kebutuhan user: blueprint 07 Case 1 Panel A (Kepala Balai: tren Penyimpanan); 06 kontrak tren. Narasi jawaban (patokan, penegakan
    penuh menunggu update context/skill): interpretasi kanonik -> angka utama -> rincian -> sebutkan pengganti bila ada bagian yang tidak terekam. Angka = jumlah kasus yang menilai (2024=12.110, 2025=8.344,
    DB staging 25 Sep 2026); bila ditanya skor kepatuhan, jawab skor rata-rata secara terpisah. Narasi jawaban (patokan): interpretasi kanonik -> angka utama -> rincian -> sebutkan pengganti bila ada bagian
    yang tidak terekam.'
  assert_any_of:
