name: TC_PMR_LEGAL_012
scenario_id: TC-PMR-LEGAL-012
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `legal`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan legal APOTEK?'
  assert_contains:
  - 'APOTEK'
  assert_any_of:
  -
    - '35.893'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE legal = ''APOTEK'';
    
    HASIL DB 14Agu2026 = 35.893. KOLOM: `legal` di `mv_pemeriksaan`. NILAI FILTER: ''APOTEK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
