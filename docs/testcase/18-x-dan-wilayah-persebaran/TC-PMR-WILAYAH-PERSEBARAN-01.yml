name: TC_PMR_WILAYAH_PERSEBARAN_01
scenario_id: TC-PMR-WILAYAH-PERSEBARAN-01
verification_date: '2026-08-14'
description: 'TC-PMR-WILAYAH-PERSEBARAN-01 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan persebaran pemeriksaan sarana di kab/kota wilayah kerja upt pada tahun 2025.'
  assert_contains:
  - 'BALAI BESAR POM DI BANDUNG'
  assert_any_of:
  -
    - '1'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_upt, nama_sarana, count(*) FROM mv_pemeriksaan vpb WHERE lower(nama_upt) LIKE ''%bandung%'' AND EXTRACT(YEAR FROM tanggal_mulai) = 2025 GROUP BY 1, 2;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 1601 baris; baris teratas ''BALAI BESAR POM DI BANDUNG'' dengan nilai 1.'
