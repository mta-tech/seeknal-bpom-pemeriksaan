name: TC_PMR_TUJUAN_PEMERIKSAAN_055
scenario_id: TC-PMR-TUJUAN-PEMERIKSAAN-055
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `tujuan_pemeriksaan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan tujuan pemeriksaan SURVEILANS SMKPO?'
  assert_contains:
  - 'SURVEILANS SMKPO'
  assert_any_of:
  -
    - '3.338'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tujuan_pemeriksaan = ''SURVEILANS SMKPO'';
    
    HASIL DB 14Agu2026 = 3.338. KOLOM: `tujuan_pemeriksaan` di `mv_pemeriksaan`. NILAI FILTER: ''SURVEILANS SMKPO'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
