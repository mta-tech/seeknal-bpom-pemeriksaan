name: TC_PMR_KOSONG_TINGKAT_PEMENUHAN_CPOB
scenario_id: TC-PMR-KOSONG-TINGKAT-PEMENUHAN-CPOB
verification_date: '2026-08-14'
description: 'Keterisian `tingkat_pemenuhan_cpob`; menguji penanganan penanda kosong yang lebih dari satu bentuk.'
turns:
- prompt: 'berapa pemeriksaan yang belum punya tingkat pemenuhan cpob?'
  assert_contains: []
  assert_any_of:
  -
    - '256.661'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tingkat_pemenuhan_cpob IS NULL OR btrim(tingkat_pemenuhan_cpob) = '''';
    
    HASIL DB 14Agu2026 = 256.661 kosong, 861 terisi. PENANDA KOSONG: kolom ini memakai lebih dari satu bentuk kosong, sehingga `IS NULL` saja TIDAK cukup — string kosong juga harus dihitung. Itulah sebabnya SQL di atas memakai `IS NULL OR btrim(...) = ''''`. MAKNA KOSONG: periksa apakah kosongnya acak atau menandai sebuah kelompok; bila deterministik, menyaring ''yang terisi'' diam-diam membuang kelompok itu.'
