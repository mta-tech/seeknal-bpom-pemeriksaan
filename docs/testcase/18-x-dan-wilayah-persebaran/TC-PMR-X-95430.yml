  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''PRODUK PANGAN'' AND kesimpulan = ''TMK'';
    
    HASIL DB 14Agu2026 = 31.710. DUA KOLOM BERKODE: `komoditi` = ''PRODUK PANGAN'' dan `kesimpulan` = ''TMK''. Keduanya nilai persis dari data. Bila kolom vonis termasuk di sini, ingat bahwa gradasi dicocokkan dengan pola awalan bila pertanyaannya menyebut keluarga, bukan satu tingkat tertentu.'
