name: TC_PMR_TUJUAN_PEMERIKSAAN_053
scenario_id: TC-PMR-TUJUAN-PEMERIKSAAN-053
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `tujuan_pemeriksaan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan tujuan pemeriksaan NATAL DAN TAHUN BARU?'
  assert_contains:
  - 'NATAL DAN TAHUN BARU'
  assert_any_of:
  -
    - '4.847'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tujuan_pemeriksaan = ''NATAL DAN TAHUN BARU'';
    
    HASIL DB 14Agu2026 = 4.847. KOLOM: `tujuan_pemeriksaan` di `mv_pemeriksaan`. NILAI FILTER: ''NATAL DAN TAHUN BARU'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
