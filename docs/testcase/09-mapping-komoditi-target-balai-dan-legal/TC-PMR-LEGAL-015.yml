name: TC_PMR_LEGAL_015
scenario_id: TC-PMR-LEGAL-015
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `legal`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan legal PKM?'
  assert_contains:
  - 'PKM'
  assert_any_of:
  -
    - '19.592'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE legal = ''PKM'';
    
    HASIL DB 14Agu2026 = 19.592. KOLOM: `legal` di `mv_pemeriksaan`. NILAI FILTER: ''PKM'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
