name: TC_PMR_LEGAL_014
scenario_id: TC-PMR-LEGAL-014
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `legal`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan legal SWALAYAN / MINI MARKET / SUPER MARKET?'
  assert_contains:
  - 'SWALAYAN / MINI MARKET / SUPER MARKET'
  assert_any_of:
  -
    - '26.406'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE legal = ''SWALAYAN / MINI MARKET / SUPER MARKET'';
    
    HASIL DB 14Agu2026 = 26.406. KOLOM: `legal` di `mv_pemeriksaan`. NILAI FILTER: ''SWALAYAN / MINI MARKET / SUPER MARKET'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
