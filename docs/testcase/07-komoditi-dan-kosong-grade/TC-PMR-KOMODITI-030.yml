name: TC_PMR_KOMODITI_030
scenario_id: TC-PMR-KOMODITI-030
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi PSIKOTROPIKA?'
  assert_contains:
  - 'PSIKOTROPIKA'
  assert_any_of:
  -
    - '252'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''PSIKOTROPIKA'';
    
    HASIL DB 14Agu2026 = 252.
    
    KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER: ''PSIKOTROPIKA'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
