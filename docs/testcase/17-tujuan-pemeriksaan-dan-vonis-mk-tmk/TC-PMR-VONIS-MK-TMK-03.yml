turns:
- prompt: 'tampilkan jumlah sarana yang memenuhi ketentuan di wilayah upt surabaya dan pada tahun 2025.'
  assert_contains:
  - 'BALAI BESAR POM DI SURABAYA'
  assert_any_of:
  -
    - 'tidak ada|tidak ditemukan|kosong'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_upt, count(*) FROM mv_pemeriksaan vpb WHERE lower(nama_upt) LIKE ''%surabaya%'' AND EXTRACT(YEAR FROM tanggal_mulai) = 2025 AND kesimpulan LIKE ''MK'' GROUP BY 1;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 1 baris; baris teratas ''BALAI BESAR POM DI SURABAYA'' dengan nilai 466.
    
    CATATAN URUTAN: hasilnya tidak menghasilkan cacah yang stabil; yang diperiksa hanya isi jawaban.'
