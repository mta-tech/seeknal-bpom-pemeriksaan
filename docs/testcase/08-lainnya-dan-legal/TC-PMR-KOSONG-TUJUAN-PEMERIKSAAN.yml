name: TC_PMR_KOSONG_TUJUAN_PEMERIKSAAN
scenario_id: TC-PMR-KOSONG-TUJUAN-PEMERIKSAAN
verification_date: '2026-08-14'
description: 'Keterisian `tujuan_pemeriksaan`; menguji penanganan penanda kosong yang lebih dari satu bentuk.'
turns:
- prompt: 'berapa pemeriksaan yang belum punya tujuan pemeriksaan?'
  assert_contains: []
  assert_any_of:
  -
    - '947'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tujuan_pemeriksaan IS NULL OR btrim(tujuan_pemeriksaan) = '''';
    
    HASIL DB 14Agu2026 = 947 kosong, 256.575 terisi. PENANDA KOSONG: kolom ini memakai lebih dari satu bentuk kosong, sehingga `IS NULL` saja TIDAK cukup — string kosong juga harus dihitung. Itulah sebabnya SQL di atas memakai `IS NULL OR btrim(...) = ''''`. MAKNA KOSONG: periksa apakah kosongnya acak atau menandai sebuah kelompok; bila deterministik, menyaring ''yang terisi'' diam-diam membuang kelompok itu.'
