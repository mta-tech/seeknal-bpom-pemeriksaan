    - 'TOKO OBAT SYIFA FARMA'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_sarana FROM mv_pemeriksaan WHERE lower(komoditi) IN (''obat tradisional'', ''suplemen kesehatan'', ''obat'') AND kesimpulan = ''TTP'' AND EXTRACT(YEAR FROM tanggal_selesai) = 2025;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: daftar rinci, bukan satu angka; sajikan sebagai tabel. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 110 baris; baris teratas ''TOKO OBAT SYIFA FARMA''.'
