name: TC_PMR_KOMODITI_026
scenario_id: TC-PMR-KOMODITI-026
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi KOSMETIK?'
  assert_contains:
  - 'KOSMETIK'
  assert_any_of:
  -
    - '39.318'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''KOSMETIK'';
    
    HASIL DB 14Agu2026 = 39.318. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER: ''KOSMETIK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
