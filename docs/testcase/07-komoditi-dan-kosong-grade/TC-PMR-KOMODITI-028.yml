name: TC_PMR_KOMODITI_028
scenario_id: TC-PMR-KOMODITI-028
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi SUPLEMEN KESEHATAN?'
  assert_contains:
  - 'SUPLEMEN KESEHATAN'
  assert_any_of:
  -
    - '7.130'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''SUPLEMEN KESEHATAN'';
    
    HASIL DB 14Agu2026 = 7.130. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER: ''SUPLEMEN KESEHATAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
