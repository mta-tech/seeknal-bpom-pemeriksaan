name: TC_PMR_KESIMPULAN_023
scenario_id: TC-PMR-KESIMPULAN-023
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `kesimpulan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan kesimpulan TDP?'
  assert_contains:
  - 'TDP'
  assert_any_of:
  -
    - '790'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE kesimpulan = ''TDP'';
    
    HASIL DB 14Agu2026 = 790.
    
    KOLOM: `kesimpulan` di `mv_pemeriksaan`. NILAI FILTER: ''TDP'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
