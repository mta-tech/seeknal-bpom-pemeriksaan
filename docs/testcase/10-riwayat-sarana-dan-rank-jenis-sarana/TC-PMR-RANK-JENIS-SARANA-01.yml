name: TC_PMR_RANK_JENIS_SARANA_01
scenario_id: TC-PMR-RANK-JENIS-SARANA-01
verification_date: '2026-08-14'
description: 'Peringkat nilai `jenis_sarana`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'jenis sarana apa yang paling banyak pada pemeriksaan?'
  assert_contains:
  - 'PANGAN'
  assert_any_of:
  -
    - '61.558'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT jenis_sarana, COUNT(*) AS jumlah FROM mv_pemeriksaan WHERE jenis_sarana IS NOT NULL AND btrim(jenis_sarana) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''PANGAN'' dengan 61.558. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(jenis_sarana) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
