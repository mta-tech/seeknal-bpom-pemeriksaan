name: TC_PMR_KOMODITI_025
scenario_id: TC-PMR-KOMODITI-025
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi OBAT?'
  assert_contains:
  - 'OBAT'
  assert_any_of:
  -
    - '82.867'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''OBAT'';
    
    HASIL DB 14Agu2026 = 82.867. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER: ''OBAT'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
