name: TC_PMR_JENIS_SARANA_006
scenario_id: TC-PMR-JENIS-SARANA-006
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana PANGAN IRT (CPPB - IRT)?'
  assert_contains:
  - 'PANGAN IRT (CPPB - IRT)'
  assert_any_of:
  -
    - '10.284'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''PANGAN IRT (CPPB - IRT)'';
    
    HASIL DB 14Agu2026 = 10.284. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''PANGAN IRT (CPPB - IRT)'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
