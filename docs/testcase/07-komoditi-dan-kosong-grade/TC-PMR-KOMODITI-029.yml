name: TC_PMR_KOMODITI_029
scenario_id: TC-PMR-KOMODITI-029
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `komoditi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi NARKOTIKA?'
  assert_contains:
  - 'NARKOTIKA'
  assert_any_of:
  -
    - '273'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''NARKOTIKA'';
    
    HASIL DB 14Agu2026 = 273.
    
    KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER: ''NARKOTIKA'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
