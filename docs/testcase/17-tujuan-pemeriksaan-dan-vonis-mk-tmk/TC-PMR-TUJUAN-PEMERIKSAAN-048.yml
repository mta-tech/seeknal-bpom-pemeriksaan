name: TC_PMR_TUJUAN_PEMERIKSAAN_048
scenario_id: TC-PMR-TUJUAN-PEMERIKSAAN-048
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `tujuan_pemeriksaan`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan tujuan pemeriksaan PEMERIKSAAN RUTIN?'
  assert_contains:
  - 'PEMERIKSAAN RUTIN'
  assert_any_of:
  -
    - '200.660'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE tujuan_pemeriksaan = ''PEMERIKSAAN RUTIN'';
    
    HASIL DB 14Agu2026 = 200.660. KOLOM: `tujuan_pemeriksaan` di `mv_pemeriksaan`. NILAI FILTER: ''PEMERIKSAAN RUTIN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
