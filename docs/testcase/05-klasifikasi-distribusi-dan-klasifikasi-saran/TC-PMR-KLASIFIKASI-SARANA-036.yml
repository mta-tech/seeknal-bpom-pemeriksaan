name: TC_PMR_KLASIFIKASI_SARANA_036
scenario_id: TC-PMR-KLASIFIKASI-SARANA-036
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `klasifikasi_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan klasifikasi sarana SARANA RITEL MODERN?'
  assert_contains:
  - 'SARANA RITEL MODERN'
  assert_any_of:
  -
    - '30.088'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE klasifikasi_sarana = ''SARANA RITEL MODERN'';
    
    HASIL DB 14Agu2026 = 30.088. KOLOM: `klasifikasi_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''SARANA RITEL MODERN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
