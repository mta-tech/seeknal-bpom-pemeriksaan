name: TC_PMR_RIWAYAT_SARANA_08
scenario_id: TC-PMR-RIWAYAT-SARANA-08
verification_date: '2026-08-14'
description: 'TC-PMR-RIWAYAT-SARANA-08 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan riwayat pemeriksaan sarana produksi ''maha siri jaya'' pada rentang tahun yang tersedia.'
  assert_contains:
  - 'MAHA SIRI JAYA'
  assert_any_of:
  -
    - 'MAHA SIRI JAYA'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_sarana, sarana, jenis_sarana, mpt.product_name, tanggal_mulai, mpt.tp_kategori FROM public.mv_pemeriksaan mp JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE lower(sarana) LIKE ''%produksi%'' AND lower(mp.nama_sarana) LIKE ''%maha siri jaya%'';
    
    DATA YANG DITANYA: mv_pemeriksaan + mv_pemeriksaan_temuan. BENTUK JAWABAN: daftar rinci, bukan satu angka; sajikan sebagai tabel. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 9 baris; baris teratas ''MAHA SIRI JAYA''.'
