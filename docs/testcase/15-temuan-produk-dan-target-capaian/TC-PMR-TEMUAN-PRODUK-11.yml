name: TC_PMR_TEMUAN_PRODUK_11
scenario_id: TC-PMR-TEMUAN-PRODUK-11
verification_date: '2026-08-14'
description: 'TC-PMR-TEMUAN-PRODUK-11 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan total temuan produk dan total nilai temuan pada kategori tanpa izin edar.'
  assert_contains:
  - 'Aspek CPOB / CPOTB / CPMB, TIE (Tanpa Izin Edar)'
  assert_any_of:
  -
    - 'Aspek CPOB / CPOTB / CPMB, TIE (Tanpa Izin Edar)'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT mpt.tp_kategori, sum(mpt.tp_harga_total) FROM public.mv_pemeriksaan mp LEFT OUTER JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE lower(mpt.tp_kategori) LIKE ''%tie%'' AND lower(kesimpulan) = ''tmk'' AND status IN (''VERIFY4'', ''VERIFY5'',''VERIFY6'',''VERIFY7'',''FINISHED'') GROUP BY 1;
    
    DATA YANG DITANYA: mv_pemeriksaan_temuan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 50 baris; baris teratas ''Aspek CPOB / CPOTB / CPMB, TIE (Tanpa Izin Edar)''.'
