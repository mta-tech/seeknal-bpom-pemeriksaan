description: 'TC-PMR-SARANA-TUTUP-02 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan profil pemeriksaan sarana produksi obat dan makanan selama periode 2025 dalam bentuk tabel dan grafik jumlah sarana produksi mk, tmk, tidak dapat dinilai, tutup per jenis komoditi (obat, ob'
  assert_contains:
  - 'KOSMETIK'
  assert_any_of:
  -
    - '3.979'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT komoditi, kesimpulan, COUNT(*) AS jumlah_pemeriksaan FROM mv_pemeriksaan where kesimpulan != ''Null'' and extract(year from tanggal_selesai) = 2025 and komoditi in (''OBAT'', ''KOSMETIK'', ''SUPLEMEN KESEHATAN'', ''PRODUK PANGAN'') GROUP BY komoditi, kesimpulan ORDER BY komoditi, kesimpulan;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_selesai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 20 baris; baris teratas ''KOSMETIK'' dengan nilai 3.979.'
