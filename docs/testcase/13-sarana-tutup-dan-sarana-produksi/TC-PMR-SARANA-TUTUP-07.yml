turns:
- prompt: 'sarana produksi kosmetik apa saja yang tutup dalam periode tahun 2025?'
  assert_contains:
  - 'MITRA EKA SUKSES '
  assert_any_of:
  -
    - 'MITRA EKA SUKSES '
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_sarana, tanggal_mulai, kesimpulan FROM public.mv_pemeriksaan WHERE LOWER(sarana) LIKE ''%produksi%'' AND LOWER(komoditi) LIKE ''%kosmetik%'' AND kesimpulan = ''TTP'' AND EXTRACT(YEAR FROM tanggal_mulai) = 2025;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: daftar rinci, bukan satu angka; sajikan sebagai tabel. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 4 baris; baris teratas ''MITRA EKA SUKSES ''.'
