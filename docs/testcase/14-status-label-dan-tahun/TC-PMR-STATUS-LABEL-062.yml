name: TC_PMR_STATUS_LABEL_062
scenario_id: TC-PMR-STATUS-LABEL-062
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `status_label`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan status label SUPERVISOR 2 PUSAT - VERIFIKASI?'
  assert_contains:
  - 'SUPERVISOR 2 PUSAT - VERIFIKASI'
  assert_any_of:
  -
    - '1.008'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE status_label = ''SUPERVISOR 2 PUSAT - VERIFIKASI'';
    
    HASIL DB 14Agu2026 = 1.008. KOLOM: `status_label` di `mv_pemeriksaan`. NILAI FILTER: ''SUPERVISOR 2 PUSAT - VERIFIKASI'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
