name: TC_PMR_KOM_OBAT_2024
scenario_id: TC-PMR-KOM-OBAT-2024
verification_date: '2026-08-14'
description: 'Silang komoditi dengan periode; menguji apakah kedua komponen pertanyaan masuk ke filter.'
turns:
- prompt: 'berapa pemeriksaan komoditi OBAT pada tahun 2024?'
  assert_contains:
  - 'OBAT'
  - '2024'
  assert_any_of:
  -
    - '14.229'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''OBAT'' AND tanggal_mulai >= ''2024-01-01'' AND tanggal_mulai < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 14.229. DUA FILTER SEKALIGUS: komoditi dan periode. Keduanya harus muncul di SQL final; komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap. NILAI KOMODITI: ''OBAT'' — ejaan domain ini, tidak berlaku di domain lain.'
