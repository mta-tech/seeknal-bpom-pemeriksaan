name: TC_PMR_TREN_HASIL_PEMERIKSAAN_05
scenario_id: TC-PMR-TREN-HASIL-PEMERIKSAAN-05
verification_date: '2026-08-14'
description: 'TC-PMR-TREN-HASIL-PEMERIKSAAN-05 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'bagaimana tren data hasil pengawasan sarana produksi kosmetik yang tidak memenuhi ketentuan berdasarkan kategori temuan (tmk tie/cpkb/cpkb habis/tidak memiliki cpkb) dalam periode tahun 2025?'
  assert_contains:
  - 'PRODUKSI'
  assert_any_of:
  -
    - '32'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT EXTRACT(MONTH FROM tanggal_mulai) AS bulan, mp.sarana, mp.komoditi, mpt.tp_kategori, count(*) FROM public.mv_pemeriksaan mp LEFT OUTER JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE EXTRACT(YEAR FROM tanggal_mulai) = 2025 AND lower(komoditi) like ''%kosmetik%'' AND lower(sarana) like ''%produksi%'' GROUP BY 1, 2, 3, 4;
    
    DATA YANG DITANYA: tanggal_mulai + mv_pemeriksaan + mv_pemeriksaan_kategori_temuan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 25 baris; baris teratas ''PRODUKSI'' dengan nilai 32.'
