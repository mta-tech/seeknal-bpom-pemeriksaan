name: TC_PMR_STATUS_LABEL_061
scenario_id: TC-PMR-STATUS-LABEL-061
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `status_label`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan status label OPERATOR - DRAFT?'
  assert_contains:
  - 'OPERATOR - DRAFT'
  assert_any_of:
  -
    - '3.260'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE status_label = ''OPERATOR - DRAFT'';
    
    HASIL DB 14Agu2026 = 3.260. KOLOM: `status_label` di `mv_pemeriksaan`. NILAI FILTER: ''OPERATOR - DRAFT'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
