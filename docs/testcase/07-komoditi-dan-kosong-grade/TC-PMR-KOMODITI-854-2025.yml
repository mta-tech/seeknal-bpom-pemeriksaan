name: TC_PMR_KOMODITI_854_2025
scenario_id: TC-PMR-KOMODITI-854-2025
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi OBAT pada tahun 2025?'
  assert_contains:
  - 'OBAT'
  - '2025'
  assert_any_of:
  -
    - '10.097'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''OBAT'' AND tanggal_mulai >= ''2025-01-01'' AND tanggal_mulai < ''2026-01-01'';
    
    HASIL DB 14Agu2026 = 10.097. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER ''OBAT'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
