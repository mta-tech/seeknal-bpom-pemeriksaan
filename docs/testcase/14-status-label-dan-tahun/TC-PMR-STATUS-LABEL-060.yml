name: TC_PMR_STATUS_LABEL_060
scenario_id: TC-PMR-STATUS-LABEL-060
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `status_label`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan status label DIREKTUR - VERIFIKASI?'
  assert_contains:
  - 'DIREKTUR - VERIFIKASI'
  assert_any_of:
  -
    - '4.768'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE status_label = ''DIREKTUR - VERIFIKASI'';
    
    HASIL DB 14Agu2026 = 4.768. KOLOM: `status_label` di `mv_pemeriksaan`. NILAI FILTER: ''DIREKTUR - VERIFIKASI'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
