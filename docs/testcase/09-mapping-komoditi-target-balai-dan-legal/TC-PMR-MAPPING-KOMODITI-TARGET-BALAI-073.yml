name: TC_PMR_MAPPING_KOMODITI_TARGET_BALAI_073
scenario_id: TC-PMR-MAPPING-KOMODITI-TARGET-BALAI-073
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `mapping_komoditi_target_balai`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan mapping komoditi target balai OBAT KUASI?'
  assert_contains:
  - 'OBAT KUASI'
  assert_any_of:
  -
    - '108'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE mapping_komoditi_target_balai = ''OBAT KUASI'';
    
    HASIL DB 14Agu2026 = 108.
    
    KOLOM: `mapping_komoditi_target_balai` di `mv_pemeriksaan`. NILAI FILTER: ''OBAT KUASI'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
