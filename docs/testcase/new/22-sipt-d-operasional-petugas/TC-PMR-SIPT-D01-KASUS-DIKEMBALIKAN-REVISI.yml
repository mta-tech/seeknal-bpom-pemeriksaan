  note: 'SQL: SELECT count(*) FROM fact_pemeriksaan f JOIN dim_status_code s ON s.id=f.status_id WHERE s.status_code IN (''DRAFT_REVISE'',''DRAFT_PUSAT'',''DRAFT_PUSAT_REVISE'') AND f.is_data_uji IS NOT
    TRUE; DB staging 25 Sep 2026: revisi+kirim-ulang=5.565 (DRAFT_REVISE 5.108 + DRAFT_PUSAT 464 + DRAFT_PUSAT_REVISE 14). Status via status_id->dim_status_code; sebut kode + penjelasan (label tampilan
    kosong). Kebutuhan user: blueprint 01 par.2 Persona Petugas UPT (kasus apa yang masih draft/dikembalikan); FLOW 1-2. Narasi jawaban (patokan, penegakan penuh menunggu update context/skill): interpretasi
    kanonik -> angka utama -> rincian -> sebutkan pengganti bila ada bagian yang tidak terekam. Dua bacaan sah: hanya status REVISE (5.113) atau termasuk DRAFT_PUSAT (total 5.565) - sebut komposisi. Narasi
    jawaban (patokan): interpretasi kanonik -> angka utama -> rincian -> sebutkan pengganti bila ada bagian yang tidak terekam.'
  assert_any_of:
  - - '5.113'
  - - '5.565'
