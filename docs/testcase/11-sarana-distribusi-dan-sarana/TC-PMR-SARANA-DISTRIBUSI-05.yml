name: TC_PMR_SARANA_DISTRIBUSI_05
scenario_id: TC-PMR-SARANA-DISTRIBUSI-05
verification_date: '2026-08-14'
description: 'TC-PMR-SARANA-DISTRIBUSI-05 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan jumlah nilai temuan produk sarana distribusi pada tahun 2025 dalam rupiah?'
  assert_contains:
  - 'DISTRIBUSI'
  assert_any_of:
  -
    - 'DISTRIBUSI'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT mp.sarana, mp.komoditi, mpt.tp_kategori, sum(mpt.tp_harga_total) FROM public.mv_pemeriksaan mp JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE EXTRACT(YEAR FROM tanggal_mulai) = 2025 AND lower(sarana) like ''%distribusi%'' AND mp.status IN (''VERIFY4'', ''VERIFY5'',''VERIFY6'',''VERIFY7'',''FINISHED'') GROUP BY 1, 2, 3;
    
    DATA YANG DITANYA: mv_pemeriksaan + mv_pemeriksaan_temuan + tanggal_mulai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 89 baris; baris teratas ''DISTRIBUSI''.'
