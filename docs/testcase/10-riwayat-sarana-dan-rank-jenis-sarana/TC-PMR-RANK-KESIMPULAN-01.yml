name: TC_PMR_RANK_KESIMPULAN_01
scenario_id: TC-PMR-RANK-KESIMPULAN-01
verification_date: '2026-08-14'
description: 'Peringkat nilai `kesimpulan`; menguji pengeluaran penanda kosong dari peringkat.'
turns:
- prompt: 'kesimpulan apa yang paling banyak pada pemeriksaan?'
  assert_contains:
  - 'MK'
  assert_any_of:
  -
    - '176.820'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT kesimpulan, COUNT(*) AS jumlah FROM mv_pemeriksaan WHERE kesimpulan IS NOT NULL AND btrim(kesimpulan) <> '''' GROUP BY 1 ORDER BY 2 DESC LIMIT 5;
    
    HASIL DB 14Agu2026: teratas ''MK'' dengan 176.820. KOLOM: `kesimpulan` di `mv_pemeriksaan`. Baris dengan nilai kosong dikeluarkan lewat `btrim(kesimpulan) <> ''''` — penanda kosong bukan kategori dan tidak boleh ikut diperingkat. Sebutkan porsi yang dikeluarkan bila besar.'
