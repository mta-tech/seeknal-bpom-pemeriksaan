turns:
- prompt: 'upt manakah yang hasil pemeriksaannya memiliki perserntase tmk terbanyak pada tahun 2025'
  assert_contains:
  - 'BALAI BESAR POM DI BANDUNG'
  assert_any_of:
  -
    - '678'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT nama_upt, count(*) as jumlah_tmk FROM mv_pemeriksaan WHERE EXTRACT(YEAR FROM tanggal_mulai) = 2025 AND kesimpulan = ''TMK'' GROUP BY nama_upt ORDER BY COUNT(*) DESC LIMIT 1;
    
    DATA YANG DITANYA: mv_pemeriksaan + tanggal_mulai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 1 baris; baris teratas ''BALAI BESAR POM DI BANDUNG'' dengan nilai 678.'
