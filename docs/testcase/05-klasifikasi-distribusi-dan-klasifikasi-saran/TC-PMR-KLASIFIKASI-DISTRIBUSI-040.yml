name: TC_PMR_KLASIFIKASI_DISTRIBUSI_040
scenario_id: TC-PMR-KLASIFIKASI-DISTRIBUSI-040
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `klasifikasi_distribusi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan klasifikasi distribusi TOKO KOSMETIK / SWALAYAN / PENGECER?'
  assert_contains:
  - 'TOKO KOSMETIK / SWALAYAN / PENGECER'
  assert_any_of:
  -
    - '18.031'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE klasifikasi_distribusi = ''TOKO KOSMETIK / SWALAYAN / PENGECER'';
    
    HASIL DB 14Agu2026 = 18.031. KOLOM: `klasifikasi_distribusi` di `mv_pemeriksaan`. NILAI FILTER: ''TOKO KOSMETIK / SWALAYAN / PENGECER'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
