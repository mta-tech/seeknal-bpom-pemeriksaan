name: TC_PMR_TEMUAN_PRODUK_10
scenario_id: TC-PMR-TEMUAN-PRODUK-10
verification_date: '2026-08-14'
description: 'TC-PMR-TEMUAN-PRODUK-10 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan total temuan produk dan total nilai temuan pada kategori lainnya.'
  assert_contains:
  - 'ED (Expire Date / Kedaluwarsa), Lain - Lain'
  assert_any_of:
  -
    - 'ED (Expire Date / Kedaluwarsa), Lain - Lain'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT mpt.tp_kategori, sum(mpt.tp_harga_total) FROM public.mv_pemeriksaan mp LEFT OUTER JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE lower(mpt.tp_kategori) LIKE ''%lain - lain%'' AND lower(kesimpulan) = ''tmk'' AND status IN (''VERIFY4'', ''VERIFY5'',''VERIFY6'',''VERIFY7'',''FINISHED'') GROUP BY 1;
    
    DATA YANG DITANYA: mv_pemeriksaan + mv_pemeriksaan_temuan. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 7 baris; baris teratas ''ED (Expire Date / Kedaluwarsa), Lain - Lain''.'
