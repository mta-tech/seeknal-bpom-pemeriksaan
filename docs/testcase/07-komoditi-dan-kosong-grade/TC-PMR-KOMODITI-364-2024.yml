name: TC_PMR_KOMODITI_364_2024
scenario_id: TC-PMR-KOMODITI-364-2024
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi KOSMETIK pada tahun 2024?'
  assert_contains:
  - 'KOSMETIK'
  - '2024'
  assert_any_of:
  -
    - '8.276'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''KOSMETIK'' AND tanggal_mulai >= ''2024-01-01'' AND tanggal_mulai < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 8.276. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER ''KOSMETIK'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
