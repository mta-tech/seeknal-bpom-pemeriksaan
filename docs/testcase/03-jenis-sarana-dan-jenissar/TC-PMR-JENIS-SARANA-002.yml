name: TC_PMR_JENIS_SARANA_002
scenario_id: TC-PMR-JENIS-SARANA-002
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana APOTEK?'
  assert_contains:
  - 'APOTEK'
  assert_any_of:
  -
    - '27.510'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''APOTEK'';
    
    HASIL DB 14Agu2026 = 27.510. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''APOTEK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
