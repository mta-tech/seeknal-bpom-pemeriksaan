name: TC_PMR_SARANA_DISTRIBUSI_07
scenario_id: TC-PMR-SARANA-DISTRIBUSI-07
verification_date: '2026-08-14'
description: 'TC-PMR-SARANA-DISTRIBUSI-07 — Regresi dari pertanyaan nyata sistem lama; angka diverifikasi ulang ke database.'
turns:
- prompt: 'tampilkan jumlah temuan produk sarana distribusi pada tahun 2025?'
  assert_contains:
  - 'KOSMETIK'
  assert_any_of:
  -
    - 'KOSMETIK'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT mp.komoditi, mpt.tp_kategori, sum(mpt.tp_jml_temuan) FROM public.mv_pemeriksaan mp LEFT OUTER JOIN public.mv_pemeriksaan_temuan mpt ON mp.id = mpt.id_pemeriksaan WHERE EXTRACT(YEAR FROM tanggal_mulai) = 2025 AND lower(sarana) LIKE ''%distribusi%'' AND lower(kesimpulan) = ''tmk'' AND status IN (''VERIFY4'', ''VERIFY5'',''VERIFY6'',''VERIFY7'',''FINISHED'') GROUP BY 1, 2;
    
    DATA YANG DITANYA: mv_pemeriksaan + mv_pemeriksaan_temuan + tanggal_mulai. BENTUK JAWABAN: satu angka agregat; sebutkan entity dan lingkup filternya. Hasilnya daftar: yang diperiksa isi baris teratas, bukan seluruh daftar.;
    HASIL DB 14Agu2026: 90 baris; baris teratas ''KOSMETIK''.'
