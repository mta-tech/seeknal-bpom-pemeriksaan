name: TC_PMR_GRADE_033
scenario_id: TC-PMR-GRADE-033
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `grade`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan grade B?'
  assert_contains:
  - 'B'
  assert_any_of:
  -
    - '9.750'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE grade = ''B'';
    
    HASIL DB 14Agu2026 = 9.750. KOLOM: `grade` di `mv_pemeriksaan`. NILAI FILTER: ''B'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
