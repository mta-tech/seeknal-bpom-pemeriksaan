name: TC_PMR_JENIS_SARANA_000
scenario_id: TC-PMR-JENIS-SARANA-000
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana PANGAN?'
  assert_contains:
  - 'PANGAN'
  assert_any_of:
  -
    - '61.558'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''PANGAN'';
    
    HASIL DB 14Agu2026 = 61.558. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''PANGAN'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
