description: 'Cacah pemeriksaan untuk satu nilai `klasifikasi_distribusi`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan klasifikasi distribusi KLINIK KECANTIKAN / SALON / SPA?'
  assert_contains:
  - 'KLINIK KECANTIKAN / SALON / SPA'
  assert_any_of:
  -
    - '4.045'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE klasifikasi_distribusi = ''KLINIK KECANTIKAN / SALON / SPA'';
    
    HASIL DB 14Agu2026 = 4.045. KOLOM: `klasifikasi_distribusi` di `mv_pemeriksaan`. NILAI FILTER: ''KLINIK KECANTIKAN / SALON / SPA'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
