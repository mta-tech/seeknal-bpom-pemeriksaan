name: TC_PMR_KOSONG_GRADE
scenario_id: TC-PMR-KOSONG-GRADE
verification_date: '2026-08-14'
description: 'Keterisian `grade`; menguji penanganan penanda kosong yang lebih dari satu bentuk.'
turns:
- prompt: 'berapa pemeriksaan yang belum punya grade?'
  assert_contains: []
  assert_any_of:
  -
    - '213.393'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE grade IS NULL OR btrim(grade) = '''';
    
    HASIL DB 14Agu2026 = 213.393 kosong, 44.129 terisi. PENANDA KOSONG: kolom ini memakai lebih dari satu bentuk kosong, sehingga `IS NULL` saja TIDAK cukup — string kosong juga harus dihitung. Itulah sebabnya SQL di atas memakai `IS NULL OR btrim(...) = ''''`. MAKNA KOSONG: periksa apakah kosongnya acak atau menandai sebuah kelompok; bila deterministik, menyaring ''yang terisi'' diam-diam membuang kelompok itu.'
