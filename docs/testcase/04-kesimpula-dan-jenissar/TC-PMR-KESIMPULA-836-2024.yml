name: TC_PMR_KESIMPULA_836_2024
scenario_id: TC-PMR-KESIMPULA-836-2024
verification_date: '2026-08-14'
description: 'Silang `kesimpulan` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pemeriksaan dengan kesimpulan TMK pada tahun 2024?'
  assert_contains:
  - 'TMK'
  - '2024'
  assert_any_of:
  -
    - '11.550'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE kesimpulan = ''TMK'' AND tanggal_mulai >= ''2024-01-01'' AND tanggal_mulai < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 11.550. KOLOM: `kesimpulan` di `mv_pemeriksaan`. NILAI FILTER ''TMK'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
