name: TC_PMR_GRADE_032
scenario_id: TC-PMR-GRADE-032
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `grade`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan grade A?'
  assert_contains:
  - 'A'
  assert_any_of:
  -
    - '24.631'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE grade = ''A'';
    
    HASIL DB 14Agu2026 = 24.631. KOLOM: `grade` di `mv_pemeriksaan`. NILAI FILTER: ''A'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
