name: TC_PMR_JENIS_SARANA_003
scenario_id: TC-PMR-JENIS-SARANA-003
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana PANGAN MD?'
  assert_contains:
  - 'PANGAN MD'
  assert_any_of:
  -
    - '26.311'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''PANGAN MD'';
    
    HASIL DB 14Agu2026 = 26.311. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''PANGAN MD'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
