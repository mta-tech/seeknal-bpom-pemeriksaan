name: TC_PMR_KOMODITI_906_2024
scenario_id: TC-PMR-KOMODITI-906-2024
verification_date: '2026-08-14'
description: 'Silang `komoditi` dengan periode; menguji kelengkapan filter dari pertanyaan majemuk.'
turns:
- prompt: 'berapa pemeriksaan dengan komoditi OBAT TRADISIONAL pada tahun 2024?'
  assert_contains:
  - 'OBAT TRADISIONAL'
  - '2024'
  assert_any_of:
  -
    - '4.045'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE komoditi = ''OBAT TRADISIONAL'' AND tanggal_mulai >= ''2024-01-01'' AND tanggal_mulai < ''2025-01-01'';
    
    HASIL DB 14Agu2026 = 4.045. KOLOM: `komoditi` di `mv_pemeriksaan`. NILAI FILTER ''OBAT TRADISIONAL'' diambil apa adanya dari data. DUA KOMPONEN: nilai kode dan periode — komponen yang halamannya tidak dibuka akan hilang dari filter secara senyap.'
