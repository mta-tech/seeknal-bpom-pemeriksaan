name: TC_PMR_JENIS_SARANA_001
scenario_id: TC-PMR-JENIS-SARANA-001
verification_date: '2026-08-14'
description: 'Cacah pemeriksaan untuk satu nilai `jenis_sarana`; menguji pemetaan istilah ke kode filter yang benar.'
turns:
- prompt: 'berapa pemeriksaan dengan jenis sarana KOSMETIK?'
  assert_contains:
  - 'KOSMETIK'
  assert_any_of:
  -
    - '36.721'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE jenis_sarana = ''KOSMETIK'';
    
    HASIL DB 14Agu2026 = 36.721. KOLOM: `jenis_sarana` di `mv_pemeriksaan`. NILAI FILTER: ''KOSMETIK'' — diambil apa adanya dari data, termasuk spasi dan kapitalisasinya. Jangan mengetik nilai dari ingatan; ambil lewat SELECT DISTINCT lalu pakai persis. ENTITY: COUNT(*) menghitung baris tabel fakta.'
