name: TC_PMR_KOSONG_STATUS_LABEL
scenario_id: TC-PMR-KOSONG-STATUS-LABEL
verification_date: '2026-08-14'
description: 'Keterisian `status_label`; menguji penanganan penanda kosong yang lebih dari satu bentuk.'
turns:
- prompt: 'berapa pemeriksaan yang belum punya status label?'
  assert_contains: []
  assert_any_of:
  -
    - '114'
  tolerance_pct: 5
  note: 'SQL LENGKAP:
    SELECT COUNT(*) FROM mv_pemeriksaan WHERE status_label IS NULL OR btrim(status_label) = '''';
    
    HASIL DB 14Agu2026 = 114 kosong, 257.408 terisi. PENANDA KOSONG: kolom ini memakai lebih dari satu bentuk kosong, sehingga `IS NULL` saja TIDAK cukup — string kosong juga harus dihitung. Itulah sebabnya SQL di atas memakai `IS NULL OR btrim(...) = ''''`. MAKNA KOSONG: periksa apakah kosongnya acak atau menandai sebuah kelompok; bila deterministik, menyaring ''yang terisi'' diam-diam membuang kelompok itu.'
